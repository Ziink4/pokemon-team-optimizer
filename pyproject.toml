[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-team-optimizer"
version = "0.1.0"
description = "Find optimal Pokemon teams using linear optimization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas==2.2.2",
    "PuLP==2.8.0",
]

[project.optional-dependencies]
app = [
    "streamlit==1.35.0",
]
notebooks = [
    "beautifulsoup4==4.12.3",
    "ipython==8.12.3",
    "ipywidgets==8.1.3",
    "matplotlib==3.9.0",
    "pokebase==1.4.1",
    "Requests==2.32.3",
    "seaborn==0.13.2",
]
