[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-team-optimizer"
version = "0.1.0"
description = "Find optimal Pokemon teams using linear optimization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.4",
    "PuLP>=2.1,<4",  # PuLP 4 removed LpVariable.dicts
]

[project.scripts]
pokemon-team-optimizer-app = "pokemon_team_optimizer.app:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.33",  # needs st.html
    "streamlit-js-eval>=1.0",
]
notebooks = [
    "beautifulsoup4>=4.9",
    "ipykernel>=6",
    "ipython>=8",
    "ipywidgets>=8",
    "matplotlib>=3.5",
    "notebook>=7",
    "numpy>=1.21.3",
    "pip",
    "pokebase>=1.3",
    "requests>=2.25",
    "seaborn>=0.11",
]
dev = [
    "black[jupyter]>=24",
    "isort>=5.12",
    "pylint>=3",
]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = '''^/\.venv/'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["pokemon_team_optimizer"]
extend_skip = [".venv"]

[tool.pylint.main]
py-version = "3.10"
ignore = ["CVS", ".venv"]

[tool.pylint.format]
max-line-length = 120
