[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-team-optimizer"
version = "0.1.0"
description = "Find optimal Pokemon teams using linear optimization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.4",
    "PuLP>=2.1,<4",  # PuLP 4 removed LpVariable.dicts
]

[project.optional-dependencies]
app = [
    "streamlit>=1.33,<1.50",  # needs st.html; 1.50 rejects st.write(..., width=)
]
notebooks = [
    "beautifulsoup4>=4.9",
    "ipykernel>=6",
    "ipython>=8",
    "ipywidgets>=8",
    "matplotlib>=3.5",
    "notebook>=7",
    "numpy>=1.21.3",
    "pip",
    "pokebase>=1.3",
    "requests>=2.25",
    "seaborn>=0.11",
]
